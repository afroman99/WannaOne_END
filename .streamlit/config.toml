# 대시보드 보안 설정 (reports/보안_점검.md)

[client]
# 오류가 나도 화면에 코드 위치·파일 경로·스택을 보여 주지 않는다 (정보 노출 방지). 자세한 내용은 서버 로그에만 남는다
showErrorDetails = "none"
# 보는 사람에게 개발자 메뉴(다시 실행·설정 등)를 숨긴다
toolbarMode = "viewer"

[server]
headless = true
# 다른 사이트에서 요청을 위조하지 못하게 (기본값이지만 명시)
enableXsrfProtection = true
enableCORS = true
# 이 앱은 파일을 받지 않는다
maxUploadSize = 1
maxMessageSize = 50

[browser]
# 사용 통계를 외부로 보내지 않는다
gatherUsageStats = false

[runner]
# 실패한 화면 갱신이 남지 않게
fastReruns = true

[theme]
# 가독성 (팀원 피드백 2026-10-15): 한글 글꼴을 지정하고, 제목 크기를 줄이고, 상태 색을 의미에 맞춘다
base = "light"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseFontSize = 15
headingFontSizes = ["1.9rem", "1.45rem", "1.2rem"]
headingFontWeights = [700, 700, 600]
primaryColor = "#2f5d8a"            # 강철 파랑: 선택된 버튼·슬라이더
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1d2329"
borderColor = "#dde1e5"
redColor = "#c23b3b"                # 경보·즉시 조치
orangeColor = "#c98a12"             # 주의
greenColor = "#2e7d4f"              # 정상·충족
blueColor = "#2f5d8a"
grayColor = "#6b7480"
baseRadius = "0.5rem"
dataframeHeaderBackgroundColor = "#eef1f4"
