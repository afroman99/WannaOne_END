# 대시보드 보안 설정 (reports/연주_조기경보_결과보고서.md 9절·부록 E)

[client]
# 오류가 나도 화면에 코드 위치·파일 경로·스택을 보여 주지 않는다 (정보 노출 방지). 자세한 내용은 서버 로그에만 남는다
showErrorDetails = "none"
# 보는 사람에게 개발자 메뉴(다시 실행·설정 등)를 숨긴다
toolbarMode = "viewer"

[server]
headless = true
# 다른 사이트에서 요청을 위조하지 못하게 (기본값이지만 명시)
enableXsrfProtection = true
enableCORS = true
# 이 앱은 파일을 받지 않는다
maxUploadSize = 1
maxMessageSize = 50

[browser]
# 사용 통계를 외부로 보내지 않는다
gatherUsageStats = false

[runner]
# 실패한 화면 갱신이 남지 않게
fastReruns = true

[theme]
# CAST GUARD AI (팀원 설계와 합침, 2026-10-15): 어두운 배경과 팀원 색을 CSS 대신 테마로 지정한다
#   (CSS로 배경만 바꾸면 버튼·라디오 글자가 배경과 겹쳐 안 보이고, Streamlit 버전이 바뀌면 깨진다)
base = "dark"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseFontSize = 17
headingFontSizes = ["2rem", "1.6rem", "1.3rem"]
headingFontWeights = [800, 700, 650]
primaryColor = "#3B82F6"            # 주 버튼·선택 (화면당 주 버튼 하나)
backgroundColor = "#080F1C"
secondaryBackgroundColor = "#101D30"  # 카드·입력칸·표 머리
textColor = "#EDF4FF"
borderColor = "#263850"
linkColor = "#60A5FA"
redColor = "#FF667A"                # 경보·즉시 조치
orangeColor = "#F7B955"             # 주의
greenColor = "#2DD4A0"              # 정상·충족
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#9AAFCB"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#16263D"
