# 대시보드 보안 설정 (reports/보안_점검.md)

[client]
# 오류가 나도 화면에 코드 위치·파일 경로·스택을 보여 주지 않는다 (정보 노출 방지). 자세한 내용은 서버 로그에만 남는다
showErrorDetails = "none"
# 보는 사람에게 개발자 메뉴(다시 실행·설정 등)를 숨긴다
toolbarMode = "viewer"

[server]
headless = true
# 다른 사이트에서 요청을 위조하지 못하게 (기본값이지만 명시)
enableXsrfProtection = true
enableCORS = true
# 이 앱은 파일을 받지 않는다
maxUploadSize = 1
maxMessageSize = 50

[browser]
# 사용 통계를 외부로 보내지 않는다
gatherUsageStats = false

[runner]
# 실패한 화면 갱신이 남지 않게
fastReruns = true
